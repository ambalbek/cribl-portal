# ── Add these blocks inside your existing <VirtualHost> ──────────────────────
# Proxies all /portal/* to the cribl-portal Flask app on the remote host.
#
# IMPORTANT: Do NOT add an Alias /portal/ directive alongside these ProxyPass lines.
# Apache processes Alias in the URL translation phase (before proxying), so an
# Alias for /portal/ would intercept /portal/api/* requests and return static HTML
# instead of letting them reach Flask — causing "unexpected token '<'" JSON errors.
# Flask already serves the request page at /portal/ itself.
#
# Replace REMOTE_HOST_IP with the IP of the host running Docker.

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

ProxyTimeout 60
Timeout      60

ProxyPass        /portal  http://REMOTE_HOST_IP:9229/portal
ProxyPassReverse /portal  http://REMOTE_HOST_IP:9229/portal

ProxyPass        /health  http://REMOTE_HOST_IP:9229/health
ProxyPassReverse /health  http://REMOTE_HOST_IP:9229/health

<Location /portal>
    Require all granted
</Location>
# ─────────────────────────────────────────────────────────────────────────────
